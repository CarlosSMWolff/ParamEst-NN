name: ParamEst-NN-Env
channels:
  - conda-forge
dependencies:
  - python=3.9
  - tensorflow
  - matplotlib
  - numpy
  - jupyter
  - qutip
  - pandas
  - tqdm
  - scipy
  - scikit-learn
  - black
  - seaborn
